name = "odin-docs"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# ── AI support portal ─────────────────────────────────────────────────────────
# Secrets, set per environment with `wrangler pages secret put <NAME>`:
#   OPENROUTER_API_KEY   OpenRouter key; give it a credit limit
#   TURNSTILE_SECRET     Turnstile widget secret for the chat and ticket forms
#   IP_HASH_SALT         any long random string; salts the rate-limit IP hashes
#   INBOUND_SECRET       shared with the mailer Worker; authorizes POST /api/inbound

[vars]
CHAT_MODEL = "deepseek/deepseek-v4.1-flash"
DRAFT_MODEL = "deepseek/deepseek-v4.1-flash"
SUPPORT_EMAIL = "support@heysilkai.com"
# New-ticket and customer-reply alerts. Never support@: that address now makes tickets.
NOTIFY_EMAIL = "ijuwebdesk@gmail.com"
ACCESS_TEAM_DOMAIN = "holy-fire-69de.cloudflareaccess.com"
ACCESS_AUD = "5d1f2f48b197d0cd868f3a4eafd87e3d961c9adfedcda65ffdf6cc7bf20dc0ed"
ADMIN_EMAILS = "ijuwebdesk@gmail.com"

[[d1_databases]]
binding = "DB"
database_name = "silk-support"
database_id = "09842da3-c9e5-40d1-a6c0-bb179e2178d1"
migrations_dir = "migrations"

# Email goes out through the silk-support-mailer Worker (workers/mailer),
# because Pages Functions can't hold a send_email binding themselves.
[[services]]
binding = "MAILER"
service = "silk-support-mailer"

# Preview deployments (every non-main branch) get their own database, so test
# tickets never land in the real inbox. Pages env blocks don't inherit, hence
# the repetition.
[env.preview.vars]
CHAT_MODEL = "deepseek/deepseek-v4.1-flash"
DRAFT_MODEL = "deepseek/deepseek-v4.1-flash"
SUPPORT_EMAIL = "support@heysilkai.com"
# New-ticket and customer-reply alerts. Never support@: that address now makes tickets.
NOTIFY_EMAIL = "ijuwebdesk@gmail.com"
ACCESS_TEAM_DOMAIN = "holy-fire-69de.cloudflareaccess.com"
ACCESS_AUD = "5d1f2f48b197d0cd868f3a4eafd87e3d961c9adfedcda65ffdf6cc7bf20dc0ed"
ADMIN_EMAILS = "ijuwebdesk@gmail.com"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "silk-support-preview"
database_id = "154e338e-13fd-44ae-aa73-ade7c8677066"
migrations_dir = "migrations"

[[env.preview.services]]
binding = "MAILER"
service = "silk-support-mailer"
